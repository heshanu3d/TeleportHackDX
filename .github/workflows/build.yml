name: build

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure (CMake, Win32/x86)
        run: cmake -S . -B build -A Win32

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Compute version string
        id: vars
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SUFFIX=""
          else
            LATEST_TAG=""
            while IFS= read -r TAG; do
              if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                LATEST_TAG="$TAG"
                break
              fi
            done < <(git tag --merged HEAD --sort=-version:refname)
            BASE_VERSION="${LATEST_TAG#v}"
            if [[ -z "$BASE_VERSION" ]]; then
              BASE_VERSION=$(tr -d '[:space:]' < VERSION)
            fi
            if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semantic version: $BASE_VERSION" >&2
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            SUFFIX="rc"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "artifact_name=TeleportHackDX-v${VERSION}${SUFFIX}-win32" >> "$GITHUB_OUTPUT"

      - name: Prepare flat artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/Release/TeleportHackDX.dll dist/
          Copy-Item build/bin/Release/TeleportHackDesktop.exe dist/
          Copy-Item favlist.fav dist/
          Copy-Item hotkey.txt dist/

      - name: Upload DLL + desktop exe + starter data
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
