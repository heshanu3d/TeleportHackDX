name: build

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure (CMake, Win32/x86)
        run: cmake -S . -B build -A Win32

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: .NET SDK / runtime probe
        # Prints the SDK we're building against so the build log always
        # documents which .NET version produced the C# binaries; also
        # surfaces early if the runner image ever loses the SDK we need.
        run: dotnet --info

      - name: Publish WinForms EXE (framework-dependent, x86)
        # `dotnet publish` implies restore + build. Using the csproj
        # directly (instead of the solution) avoids the sln's Platform
        # matrix -- our C# projects only ship a single Any CPU / x86
        # PlatformTarget configuration.
        # framework-dependent (~150 KB EXE) requires the .NET 8 x86 runtime
        # on the user machine; matches the size/policy decision from the
        # last chat.
        run: >
          dotnet publish csharp/TeleportHackDesktopWinForms/TeleportHackDesktopWinForms.csproj
          --configuration Release
          --runtime win-x86
          --no-self-contained
          --output publish/winforms

      - name: Publish WPF EXE (framework-dependent, x86)
        run: >
          dotnet publish csharp/TeleportHackDesktopWpf/TeleportHackDesktopWpf.csproj
          --configuration Release
          --runtime win-x86
          --no-self-contained
          --output publish/wpf

      - name: Compute version string
        id: vars
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SUFFIX=""
          else
            LATEST_TAG=""
            while IFS= read -r TAG; do
              if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                LATEST_TAG="$TAG"
                break
              fi
            done < <(git tag --merged HEAD --sort=-version:refname)
            BASE_VERSION="${LATEST_TAG#v}"
            if [[ -z "$BASE_VERSION" ]]; then
              BASE_VERSION=$(tr -d '[:space:]' < VERSION)
            fi
            if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semantic version: $BASE_VERSION" >&2
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            SUFFIX="rc"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "artifact_name=TeleportHackDX-v${VERSION}${SUFFIX}-win32" >> "$GITHUB_OUTPUT"

      - name: Prepare flat artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/Release/TeleportHackDX.dll dist/
          Copy-Item build/bin/Release/TeleportHackDesktop.exe dist/
          Copy-Item build/bin/Release/TeleportHackLauncher.exe dist/
          Copy-Item build/bin/Release/TeleportHackCApi.dll dist/
          # C# UIs. `dotnet publish` output already contains only the runtime
          # deps we need (framework-dependent), so a flat Copy-Item is fine
          # -- no runtime installer, and the user's .NET 8 runtime supplies
          # the base class libraries.
          Copy-Item publish/winforms/TeleportHackDesktopWinForms.exe dist/
          Copy-Item publish/winforms/TeleportHackDesktopWinForms.dll dist/
          Copy-Item publish/winforms/TeleportHackDesktopWinForms.runtimeconfig.json dist/
          Copy-Item publish/winforms/TeleportHackCore.dll dist/
          Copy-Item publish/wpf/TeleportHackDesktopWpf.exe dist/
          Copy-Item publish/wpf/TeleportHackDesktopWpf.dll dist/
          Copy-Item publish/wpf/TeleportHackDesktopWpf.runtimeconfig.json dist/
          Copy-Item favlist.fav dist/
          Copy-Item hotkey.txt dist/

      - name: Upload DLL + ImGui/WPF/WinForms EXEs + launcher + C ABI + starter data
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
